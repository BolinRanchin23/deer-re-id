name: Gate 1 Production Triage

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum complete event chunks per claim
        required: false
        default: "50"
  workflow_run:
    workflows: ["Reveal Production Sync"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deerid-gate1-production
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_BUCKET: tactacam-photos
      KAGGLEHUB_CACHE: ${{ github.workspace }}/.cache/kagglehub
      GATE1_LIMIT: ${{ inputs.limit || '50' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/kagglehub
          key: speciesnet-4.0.3a
      - name: Install Gate 1 runtime
        run: python -m pip install . speciesnet==5.0.5
      - name: Catch up production triage for up to twelve minutes
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          python -m reveal_downloader.gate1_worker \
            --limit "$GATE1_LIMIT" \
            --until-empty \
            --time-budget-seconds 720
