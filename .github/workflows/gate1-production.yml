name: Gate 1 Production Triage

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum pending thumbnails
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: deerid-gate1-production
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: tactacam-photos
      KAGGLEHUB_CACHE: ${{ github.workspace }}/.cache/kagglehub
      GATE1_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/kagglehub
          key: speciesnet-4.0.3a
      - name: Install Gate 1 runtime
        run: python -m pip install . speciesnet==5.0.5
      - name: Run bounded production triage
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          python -m reveal_downloader.gate1_worker --limit "$GATE1_LIMIT"
