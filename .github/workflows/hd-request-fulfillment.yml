name: HD Request Queue Fulfillment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum queued HD requests to submit
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: deerid-hd-request-fulfillment
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit queued requests through secured production endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HD_REQUEST_BATCH: ${{ inputs.limit || '20' }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          [[ "$HD_REQUEST_BATCH" =~ ^[0-9]+$ ]]
          test "$HD_REQUEST_BATCH" -ge 1
          test "$HD_REQUEST_BATCH" -le 20
          status="$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            --max-time 58 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://deer-re-id.vercel.app/api/hd_requests?limit=$HD_REQUEST_BATCH")"
          python -m json.tool response.json
          test "$status" -ge 200
          test "$status" -lt 300
