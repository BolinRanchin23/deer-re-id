[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reveal-downloader"
version = "0.1.0"
description = "Standalone Tactacam Reveal cloud photo downloader"
requires-python = ">=3.9"
dependencies = ["Pillow>=10,<12"]

[project.optional-dependencies]
hd-localization = [
  "PytorchWildlife>=1.2.1,<2",
  "librosa>=0.11,<1",
  "soundfile>=0.13,<1",
  "setuptools<81",
]

[project.scripts]
reveal-downloader = "reveal_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["reveal_downloader*"]
